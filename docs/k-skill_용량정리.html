const LIMIT=2*1024*1024;
const sel=new Set();
const fmt=b=>(b/1024/1024).toFixed(2)+' MB';
const kb=b=>b>=1048576?fmt(b):Math.round(b/1024)+' KB';

all.forEach(a=>a.size=a.idx.reduce((s,i)=>s+DATA.sizes[i],0));
const byId=Object.fromEntries(all.map(a=>[a.id,a]));
function removedBytes(){const u=new Set();sel.forEach(id=>byId[id].idx.forEach(i=>u.add(i)));let s=0;u.forEach(i=>s+=DATA.sizes[i]);return s}
function rowHTML(a){
  return `<label class="row" data-id="${a.id}" data-text="${(a.title+' '+a.desc).toLowerCase()}">
  <input type="checkbox" id="c-${a.id.replace(/[^a-z0-9-]/gi,'_')}">
  <div style="min-width:0"><div class="name">${a.title}${a.kind==='skill'?'':'<span class="tag">스킬 아님</span>'}</div><div class="desc">${a.desc||''}</div></div>
  <div class="sz">${kb(a.size)}</div></label>`}
function render(){
  const mode=document.getElementById('sort').value;let h='';
  const ex=DATA.extras.map(e=>byId[e.id]);
  h+=`<section class="group"><div class="ghead"><h2>부가 자료 (스킬은 그대로 유지)</h2></div>${ex.map(rowHTML).join('')}</section>`;
  if(mode==='size'){
    const sk=all.filter(a=>a.kind==='skill').sort((x,y)=>y.size-x.size);
    h+=`<section class="group"><div class="ghead"><h2>스킬 110개 · 크기 큰 순</h2></div>${sk.map(rowHTML).join('')}</section>`;
  }else{
    DATA.cats.forEach(c=>{const sk=all.filter(a=>a.kind==='skill'&&a.cat===c);
      h+=`<section class="group" data-cat="${c}"><div class="ghead"><h2>${c} <span class="small">(${sk.length})</span></h2><button type="button" class="catall" data-cat="${c}">전체 선택</button></div>${sk.map(rowHTML).join('')}</section>`});
  }
  document.getElementById('list').innerHTML=h;
  document.querySelectorAll('.row').forEach(r=>{const cb=r.querySelector('input');cb.checked=sel.has(r.dataset.id);r.classList.toggle('on',cb.checked);
    cb.addEventListener('change',()=>{cb.checked?sel.add(r.dataset.id):sel.delete(r.dataset.id);r.classList.toggle('on',cb.checked);update()})});
  document.querySelectorAll('.catall').forEach(b=>b.addEventListener('click',()=>{

function filter(){const q=document.getElementById('q').value.trim().toLowerCase();
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('hidden-row',!!q&&!r.dataset.text.includes(q)));
  document.querySelectorAll('section.group').forEach(s=>{s.hidden=![...s.querySelectorAll('.row')].some(r=>!r.classList.contains('hidden-row'))})}
function update(){
  const rem=removedBytes(), cur=DATA.base+DATA.sizes.reduce((a,b)=>a+b,0)-rem, over=cur>LIMIT;

}
