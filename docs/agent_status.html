<title>에이전트 작업현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 레이아웃: 메인 에이전트(발주) 카드 → 연결선(하청) → 서브에이전트 카드 그리드, 각 카드에 진행률 막대 */
:root{
  --bg:#F3F1EE; --surface:#FFFFFF; --ink:#1B1A19; --sub:#5E5A55; --line:#E3DFD9; --wire:#C9C2B8;
  --clawd:#D97757; --tile:#232120; --ok:#15B874; --run:#0F6FFF; --wait:#9A948C;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1E1C1B; --ink:#F2EFEA; --sub:#B5AFA7; --line:#33302D; --wire:#4A4540;
  --clawd:#E2856A; --tile:#0E0D0C; --ok:#44C690; --run:#3F8CFF; --wait:#7D776F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1E1C1B; --ink:#F2EFEA; --sub:#B5AFA7; --line:#33302D; --wire:#4A4540;
  --clawd:#E2856A; --tile:#0E0D0C; --ok:#44C690; --run:#3F8CFF; --wait:#7D776F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--font);padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
h1{font-size:28px;font-weight:700;margin:0;text-wrap:balance}
.when{font:500 12px var(--mono);color:var(--sub)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sub)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.legend .l-done::before{background:var(--ok)} .legend .l-run::before{background:var(--run)} .legend .l-wait::before{background:var(--wait)} .legend .l-fail::before{background:var(--err,#E63B3B)}

/* 카드 공통 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start;position:relative}
.av{grid-row:span 4;border-radius:12px;background:var(--tile);display:grid;place-items:center}
.av svg{display:block;height:auto}
.av.run svg{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.av.run svg{animation:none}}
.nm{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0}
.nm h2,.nm h3{margin:0;font-weight:700}
.role{font:700 10px var(--mono);letter-spacing:.08em;color:var(--sub);text-transform:uppercase}
.st{font:700 11px var(--mono);letter-spacing:.04em;padding:2px 8px;border-radius:6px;color:#fff}
.st.done{background:var(--ok)} .st.run{background:var(--run)} .st.wait{background:var(--wait)} .st.fail{background:var(--err,#E63B3B)}
.bar i.fail{background:var(--err,#E63B3B)}
.task{font-size:13px;color:var(--sub);margin:0;min-width:0}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.bar{height:10px;border-radius:9999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9999px;background:var(--run);transition:width .4s}
.bar i.done{background:var(--ok)}
.pct{font:700 13px var(--mono);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.res{font:500 12px var(--mono);color:var(--sub)} .res b{color:var(--ink)}

/* 메인 에이전트 */
.main{max-width:560px;margin:0 auto;width:100%;border-color:var(--clawd);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.main .av{width:96px;height:96px} .main .av svg{width:76px}
.main h2{font-size:20px}

/* 하청 연결선 */
.org{display:grid;gap:0}
.wire{height:28px;display:grid;place-items:center}
.wire::before{content:"";width:2px;height:100%;background:var(--wire)}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px 12px;padding-top:22px;border-top:2px solid var(--wire);position:relative}
.subs .card::before{content:"";position:absolute;left:50%;top:-24px;width:2px;height:22px;background:var(--wire)}
.subs .card::after{content:attr(data-order);position:absolute;left:calc(50% + 8px);top:-22px;font:600 10px var(--mono);color:var(--sub);background:var(--bg);padding:0 4px;border-radius:4px}
.subs .av{width:64px;height:64px} .subs .av svg{width:50px}
.subs h3{font-size:15px}
.cos{grid-column:1/-1;margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px}
.cos li{font-size:12px;padding:1px 8px;border-radius:9999px;border:1px solid var(--line);color:var(--wait)}
.cos li.hit{border-color:var(--clawd);color:var(--ink);background:color-mix(in srgb,var(--clawd) 12%,transparent)}
@media (max-width:640px){
  .subs{border-top:0;border-left:2px solid var(--wire);padding:8px 0 0 16px;gap:12px}
  .subs .card::before{left:-18px;top:28px;width:16px;height:2px}
  .subs .card::after{display:none}
}
.note{font-size:12px;color:var(--sub);margin:0;max-width:72ch}
.live{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--mono);letter-spacing:.06em;color:var(--run);padding:2px 8px;border:1px solid var(--run);border-radius:9999px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--run);animation:blink 1.4s infinite}
.live.off{color:var(--sub);border-color:var(--line)} .live.off::before{background:var(--wait);animation:none}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live::before{animation:none}}
.eta{font:500 12px var(--mono);color:var(--sub);font-variant-numeric:tabular-nums}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="clawd" viewBox="0 0 18 10">
    <g fill="var(--clawd)" shape-rendering="crispEdges">
      <rect x="2" y="0" width="14" height="7"/>
      <rect x="0" y="3" width="18" height="2"/>
      <rect x="3" y="7" width="1" height="2"/><rect x="5" y="7" width="1" height="2"/>
      <rect x="12" y="7" width="1" height="2"/><rect x="14" y="7" width="1" height="2"/>
    </g>
    <g fill="var(--tile)" shape-rendering="crispEdges">
      <rect x="4" y="2" width="1" height="1"/><rect x="13" y="2" width="1" height="1"/>
    </g>
  </symbol>
</svg>

<div class="wrap">
<header>
  <div><h1>에이전트 작업현황</h1><div class="when"><span id="when"></span> · <span class="live" id="live">LIVE</span> <span id="ago"></span></div></div>
  <div class="legend"><span class="l-done">완료</span><span class="l-run">진행 중</span><span class="l-wait">대기</span><span class="l-fail">중단</span></div>
</header>
<div class="org" id="org"></div>
<p class="note" id="note"></p>
</div>

<script>
/* 작업 데이터 — 에이전트를 맡길 때마다 이 블록만 고친다 (progress: 0~100) */
var JOB={
  updated:"2026-10-06 19:19 KST",updatedISO:"2026-10-06T10:19:44Z",
  main:{name:"메인 에이전트",task:"공고별 복지(자녀학자금·노조·주택지원·기숙사) 다시 찾기 — 공고 본문 전체 재확인, 없으면 인터넷 조사",note:"이 환경에서는 채용 사이트가 403으로 막혀, 본문 재확인은 GitHub Actions 수집기에 맡기고 인터넷 조사는 서브에이전트 4개에 나눠 맡깁니다."},
  subs:[
   {name:"인터넷 조사 A",order:"하청 1",status:"done",progress:100,task:"기업 복리후생 웹 조사",result:"33곳 중 12곳 확인 (기숙사 11·자녀학자금 7·노조 7·주택지원 3)"},
   {name:"인터넷 조사 B",order:"하청 2",status:"done",progress:100,task:"기업 복리후생 웹 조사",result:"34곳 중 18곳 확인 (자녀학자금 13·기숙사 10·주택지원 7·노조 5)"},
   {name:"인터넷 조사 C",order:"하청 3",status:"done",progress:100,task:"기업 복리후생 웹 조사",result:"34곳 중 4곳 확인 (자녀학자금·기숙사·주택지원 각 3)"},
   {name:"인터넷 조사 D",order:"하청 4",status:"done",progress:100,task:"기업 복리후생 웹 조사",result:"34곳 중 4곳 확인 (노조 2·자녀학자금 1·기숙사 1·주택지원 1)"},
   {name:"수집기 수정 (collect.py)",order:"하청 5",status:"done",progress:100,task:"공고 본문 전체로 복지 다시 판정 · 인터넷 조사 결과 표시",result:"사람인 복리후생 칸 추가 조회 · 판정 표현 확대 · 이전 공고 재판정 · 인터넷 조사 점선 배지"},
   {name:"GitHub Actions 수집기 (1차)",order:"하청 6",status:"done",progress:100,task:"run #92 — 복지 재판정 + 인터넷 조사 반영",result:"복지 확인 69건 (공고 32 · 인터넷 조사 추가) · 게시 · 사람인 복리후생 칸 인식 의심"},
   {name:"GitHub Actions 수집기 (2차)",order:"하청 7",status:"done",progress:100,task:"run #94 — 사람인 복리후생 칸 확인 기록",result:"공고 화면 HTML에 복리후생 칸 없음(606건) → view-ajax 응답에서 읽도록 수정 (PR #41)"},
   {name:"GitHub Actions 수집기 (3차)",order:"하청 8",status:"done",progress:100,task:"run #96 — view-ajax로 사람인 복리후생 칸 읽기",result:"복리후생 칸 317건 읽음 · 복지 확인 73건(공고 38) · 이전 공고 69건은 시간 한도로 미판정"},
   {name:"삭제 공고 재등장 차단",order:"하청 9",status:"done",progress:100,task:"삭제한 공고가 다른 사이트에 올라와도 제외 (회사 같고 공고명 포함·85% 유사, 직무 동일)",result:"PR #43 · 현재 데이터 4건 추가 제외 · 제외 목록 414건 동기화(PR #44)"},
   {name:"GitHub Actions 수집기 (4차)",order:"하청 10",status:"run",progress:5,startedAt:"2026-10-06T10:19:25Z",etaMin:30,task:"run #100 — 이전 공고 복지 재판정(한도 12분) + 삭제 공고 재등장 차단 반영 후 게시",result:""}
  ]
};

var LABEL={done:"완료",run:"진행 중",wait:"대기",fail:"중단"};
function esc(t){var d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML}
function icon(st){return '<div class="av '+(st==='run'?'run':'')+'"><svg viewBox="0 0 18 10" role="img" aria-label="에이전트"><use href="#clawd"/></svg></div>'}
function prog(p,st,key){p=Math.max(0,Math.min(100,Math.round(p)));return '<div class="prog" data-k="'+key+'" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'"><div class="bar"><i class="'+(st==='done'?'done':st==='fail'?'fail':'')+'" style="width:'+p+'%"></i></div><span class="pct">'+p+'%</span></div>'}
/* 실시간: 진행 중 하청에 startedAt(ISO)·etaMin이 있으면 경과 시간으로 진행률을 매초 계산 (완료 전에는 최대 95%) */
function liveP(s,now){if(s.status!=='run'||!s.startedAt||!s.etaMin)return +s.progress||0;var el=(now-Date.parse(s.startedAt))/60000;return Math.max(+s.progress||0,Math.min(95,el/s.etaMin*100))}
function fmtEl(ms){var t=Math.max(0,Math.floor(ms/1000)),m=Math.floor(t/60),x=t%60;return m+'분 '+(x<10?'0':'')+x+'초'}
(function(){
  var subs=JOB.subs, n=subs.length;
  var total=n?subs.reduce(function(a,s){return a+(+s.progress||0)},0)/n:0;
  var done=subs.filter(function(s){return s.status==='done'}).length;
  var run=subs.filter(function(s){return s.status==='run'}).length;
  var mainSt=done===n?'done':(run||done?'run':'wait');
  document.getElementById('when').textContent=JOB.updated+' 기준';
  var html='<article class="card main">'+icon(mainSt)+
    '<div class="nm"><span class="role">발주 · Main</span><h2>'+esc(JOB.main.name)+'</h2><span class="st '+mainSt+'">'+LABEL[mainSt]+'</span></div>'+
    '<p class="task">'+esc(JOB.main.task)+'</p>'+prog(total,mainSt,'main')+
    '<div class="res">서브에이전트 <b>'+n+'</b> · 완료 <b>'+done+'</b> · 진행 중 <b>'+run+'</b> · 대기 <b>'+(n-done-run)+'</b></div></article>';
  html+='<div class="wire" aria-hidden="true"></div><div class="subs">';
  subs.forEach(function(s,si){
    var found=s.found||[], miss=s.miss||[], tot=found.length+miss.length;
    var res=tot?esc(s.label||'확인')+' <b>'+found.length+'</b> / '+tot+esc(s.unit||'건'):esc(s.result||'');
    html+='<article class="card" data-order="'+esc(s.order||'')+'">'+icon(s.status)+
      '<div class="nm"><span class="role">하청 · Sub</span><h3>'+esc(s.name)+'</h3><span class="st '+s.status+'">'+LABEL[s.status]+'</span></div>'+
      '<p class="task">'+esc(s.task)+'</p>'+prog(s.progress||0,s.status,'s'+si)+'<div class="res">'+res+'</div>'+(s.status==='run'&&s.startedAt?'<div class="eta" data-e="'+si+'"></div>':'');
    if(tot){html+='<ul class="cos">'+found.map(function(c){return '<li class="hit">'+esc(c)+'</li>'}).join('')+miss.map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ul>'}
    html+='</article>';
  });
  document.getElementById('org').innerHTML=html+'</div>';
  function tick(){
    var now=Date.now(), ps=subs.map(function(s){return liveP(s,now)}), avg=n?ps.reduce(function(a,b){return a+b},0)/n:0;
    function set(k,v){var el=document.querySelector('.prog[data-k="'+k+'"]'); if(!el)return; v=Math.round(v); el.setAttribute('aria-valuenow',v); el.querySelector('i').style.width=v+'%'; el.querySelector('.pct').textContent=v+'%'}
    ps.forEach(function(v,i){set('s'+i,v)}); set('main',avg);
    subs.forEach(function(s,i){var e=document.querySelector('.eta[data-e="'+i+'"]'); if(e) e.textContent='경과 '+fmtEl(now-Date.parse(s.startedAt))+(s.etaMin?' · 예상 약 '+s.etaMin+'분':'')});
    var up=Date.parse(JOB.updatedISO||''), ago=document.getElementById('ago'), live=document.getElementById('live');
    if(!isNaN(up)){ago.textContent='마지막 갱신 '+fmtEl(now-up)+' 전'}
    live.classList.toggle('off',!run); live.textContent=run?'LIVE':'대기 없음';
  }
  tick(); if(run) setInterval(tick,1000);
  document.getElementById('note').textContent=JOB.main.note+' 주황색은 결과를 찾아 반영한 항목입니다.';
})();
</script>
