# 임시: 8개 사이트 원본 HTML 스냅샷을 probe/ 에 저장 (파서 검증용, 검증 후 삭제)
name: probe-sites
on:
  push:
    branches: [claude/safety-manager-job-openings-ab59yi]
    paths: [.github/workflows/probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          i=0
          while read -r u; do
            [ -z "$u" ] && continue
            i=$((i+1))
            curl -sSL -A "$UA" -H "Accept-Language: ko-KR,ko;q=0.9" -m 40 -o probe/s$i.html \
              -w "$i %{http_code} %{size_download} %{url_effective}\n" "$u" >> probe/status.txt 2>&1 || echo "$i FAIL $u" >> probe/status.txt
          done <<'LIST'
          https://www.jobkorea.co.kr/theme/entry-level-internship
          https://www.saramin.co.kr/zf_user/search?searchword=%EC%95%88%EC%A0%84%EA%B4%80%EB%A6%AC%EC%9E%90&go=&flag=n&searchMode=1&searchType=search&search_done=y&search_optional_item=n
          https://linkareer.com/search?direction=DESC&page=1&q=%EC%95%88%EC%A0%84%EA%B4%80%EB%A6%AC%EC%9E%90&sort=RELEVANCE&tab=open-activity
          https://www.worker.co.kr/job/list.asp
          https://safety.seoultech.ac.kr/b_information/job_info
          https://safety.chungbuk.ac.kr/safety5_2
          https://www.inu.ac.kr/safety/3207/subview.do
          https://safety.pknu.ac.kr/safety/2080
          LIST
          cat probe/status.txt
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add probe
          git commit -m "probe: site HTML snapshots" && git push
