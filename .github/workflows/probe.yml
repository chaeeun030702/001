name: probe-salary
on:
  workflow_dispatch:
  push:
    branches: [claude/safety-manager-job-openings-ab59yi]
    paths: [probe/salary_probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with httpx --with beautifulsoup4 python probe/salary_probe.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add probe; git commit -qm "probe: salary snapshots" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
