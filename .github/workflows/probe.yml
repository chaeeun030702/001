# 임시: 8개 사이트 원본 HTML 스냅샷을 probe/ 에 저장 (파서 검증용, 검증 후 삭제)
name: probe-sites
on:
  push:
    branches: [claude/safety-manager-job-openings-ab59yi]
    paths: [.github/workflows/probe.yml, probe/urls2.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p probe/r2
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          : > probe/r2/status.txt
          while read -r name u; do
            [ -z "$u" ] && continue
            curl -sSL -A "$UA" -H "Accept-Language: ko-KR,ko;q=0.9" -H "Referer: $u" -m 60 -o "probe/r2/$name.html" \
              -w "$name %{http_code} %{size_download} %{url_effective}\n" "$u" >> probe/r2/status.txt 2>&1 || echo "$name FAIL" >> probe/r2/status.txt
          done < probe/urls2.txt
          cat probe/r2/status.txt
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add probe
          git commit -m "probe: site HTML snapshots" && git push
