# 임시: 충북대 안전공학과 게시판 주소 확인용 (확인 후 삭제)
name: probe-sites
on:
  push:
    branches: [claude/safety-manager-job-openings-ab59yi]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          : > probe/status.txt
          while read -r name u; do
            [ -z "$u" ] && continue
            curl -sSL -A "$UA" -H "Accept-Language: ko-KR,ko;q=0.9" -m 40 -o "probe/$name.html" \
              -D "probe/$name.hdr" -w "$name %{http_code} %{size_download} %{url_effective}\n" "$u" >> probe/status.txt 2>&1 || echo "$name FAIL $u" >> probe/status.txt
          done <<'LIST'
          cb3_www https://www.chungbuk.ac.kr/site/www/main.do
          cb3_hrd https://hrd.chungbuk.ac.kr/hrd32
          cb3_ipsi https://ipsi.chungbuk.ac.kr/
          ctl_inu https://www.inu.ac.kr/safety/3207/subview.do
          LIST
          cat probe/status.txt
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add probe
          git commit -m "probe: chungbuk snapshots 3" && for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
