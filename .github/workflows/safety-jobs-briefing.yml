# 안전관리자 채용 일일 브리핑 — 8개 사이트 수집 후 briefings/ 에 커밋
# 매일 17:30 KST 실행 → 18:00 KST Routine이 briefings/latest.* 를 읽어 브리핑 전달
name: safety-jobs-briefing
on:
  schedule:
    - cron: "30 8 * * *" # 08:30 UTC = 17:30 KST (기본 브랜치에 있을 때만 동작)
  workflow_dispatch:
  push:
    branches: [claude/safety-manager-job-openings-ab59yi]
    paths: [safety_jobs/**, .github/workflows/safety-jobs-briefing.yml]
permissions:
  contents: write
concurrency:
  group: safety-jobs-briefing
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Collect
        run: uv run safety_jobs/collect.py --out briefings
      - name: Commit briefing
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add briefings
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "briefing: $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
